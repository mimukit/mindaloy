<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;font:14px/1.5 system-ui,sans-serif;color:var(--foreground,#eaeae5)}button{font:inherit;color:inherit;background:transparent;border:1px solid var(--border,#666);border-radius:8px;padding:8px 12px;cursor:pointer}button[aria-pressed=true]{background:var(--secondary,#303030);border-color:var(--foreground,#eaeae5)}button:focus-visible{outline:2px solid var(--foreground,#eaeae5);outline-offset:3px}.pages,.themes{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}.themes{justify-content:flex-end}figure{margin:0}img{display:block;width:100%;height:auto;border-radius:12px}figcaption{font-size:14px;margin:12px 0 8px;font-weight:600}.note{color:var(--muted-foreground,#aaa);font-size:13px;margin:0 0 16px}[hidden]{display:none!important}@media(max-width:480px){.pages button{flex:1 1 45%;font-size:13px}.themes{justify-content:flex-start}}
</style></head><body><p class="note">Draft 01. Select a page and theme. Each image shows desktop and phone layouts. The page images await approval.</p>
<div class="pages" role="group" aria-label="Page"><button data-page="01-sign-in" aria-pressed="true">Sign in</button><button data-page="02-collections" aria-pressed="false">Collections</button><button data-page="03-collection-detail" aria-pressed="false">Collection detail</button><button data-page="04-card-editor" aria-pressed="false">Card editor</button><button data-page="05-review" aria-pressed="false">Review</button><button data-page="06-card-detail" aria-pressed="false">Card detail and review history</button><button data-page="07-integration-settings" aria-pressed="false">Integration settings</button></div><div class="themes" role="group" aria-label="Theme"><button data-theme="dark" aria-pressed="true">Dark</button><button data-theme="light" aria-pressed="false">Light</button></div>
<figure data-p="01-sign-in" data-t="dark" ><img src="./previews/01-sign-in-dark-v1.jpg" alt="Mindaloy Sign in, dark mode, draft 01 with desktop and phone layouts"><figcaption>Sign in · dark mode</figcaption></figure><figure data-p="01-sign-in" data-t="light" hidden><img src="./previews/01-sign-in-light-v1.jpg" alt="Mindaloy Sign in, light mode, draft 01 with desktop and phone layouts"><figcaption>Sign in · light mode</figcaption></figure><figure data-p="02-collections" data-t="dark" hidden><img src="./previews/02-collections-dark-v1.jpg" alt="Mindaloy Collections, dark mode, draft 01 with desktop and phone layouts"><figcaption>Collections · dark mode</figcaption></figure><figure data-p="02-collections" data-t="light" hidden><img src="./previews/02-collections-light-v1.jpg" alt="Mindaloy Collections, light mode, draft 01 with desktop and phone layouts"><figcaption>Collections · light mode</figcaption></figure><figure data-p="03-collection-detail" data-t="dark" hidden><img src="./previews/03-collection-detail-dark-v1.jpg" alt="Mindaloy Collection detail, dark mode, draft 01 with desktop and phone layouts"><figcaption>Collection detail · dark mode</figcaption></figure><figure data-p="03-collection-detail" data-t="light" hidden><img src="./previews/03-collection-detail-light-v1.jpg" alt="Mindaloy Collection detail, light mode, draft 01 with desktop and phone layouts"><figcaption>Collection detail · light mode</figcaption></figure><figure data-p="04-card-editor" data-t="dark" hidden><img src="./previews/04-card-editor-dark-v1.jpg" alt="Mindaloy Card editor, dark mode, draft 01 with desktop and phone layouts"><figcaption>Card editor · dark mode</figcaption></figure><figure data-p="04-card-editor" data-t="light" hidden><img src="./previews/04-card-editor-light-v1.jpg" alt="Mindaloy Card editor, light mode, draft 01 with desktop and phone layouts"><figcaption>Card editor · light mode</figcaption></figure><figure data-p="05-review" data-t="dark" hidden><img src="./previews/05-review-dark-v1.jpg" alt="Mindaloy Review, dark mode, draft 01 with desktop and phone layouts"><figcaption>Review · dark mode</figcaption></figure><figure data-p="05-review" data-t="light" hidden><img src="./previews/05-review-light-v1.jpg" alt="Mindaloy Review, light mode, draft 01 with desktop and phone layouts"><figcaption>Review · light mode</figcaption></figure><figure data-p="06-card-detail" data-t="dark" hidden><img src="./previews/06-card-detail-dark-v2.jpg" alt="Mindaloy Card detail and review history, dark mode, draft 01 with desktop and phone layouts"><figcaption>Card detail and review history · dark mode</figcaption></figure><figure data-p="06-card-detail" data-t="light" hidden><img src="./previews/06-card-detail-light-v2.jpg" alt="Mindaloy Card detail and review history, light mode, draft 01 with desktop and phone layouts"><figcaption>Card detail and review history · light mode</figcaption></figure><figure data-p="07-integration-settings" data-t="dark" hidden><img src="./previews/07-integration-settings-dark-v1.jpg" alt="Mindaloy Integration settings, dark mode, draft 01 with desktop and phone layouts"><figcaption>Integration settings · dark mode</figcaption></figure><figure data-p="07-integration-settings" data-t="light" hidden><img src="./previews/07-integration-settings-light-v1.jpg" alt="Mindaloy Integration settings, light mode, draft 01 with desktop and phone layouts"><figcaption>Integration settings · light mode</figcaption></figure>
<script>let page="01-sign-in",theme="dark";function update(){document.querySelectorAll('[data-page]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.page===page)));document.querySelectorAll('[data-theme]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.theme===theme)));document.querySelectorAll('figure').forEach(f=>f.hidden=f.dataset.p!==page||f.dataset.t!==theme)}document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{page=b.dataset.page;update()});document.querySelectorAll('[data-theme]').forEach(b=>b.onclick=()=>{theme=b.dataset.theme;update()});Promise.all([...document.images].map(i=>i.decode().catch(()=>null))).then(()=>console.log('GALLERY_CHECK',JSON.stringify({images:document.images.length,loaded:[...document.images].filter(i=>i.naturalWidth>0).length,overflow:document.documentElement.scrollWidth>innerWidth})));let checks=0;for(const b of document.querySelectorAll('[data-page]')){b.click();for(const t of document.querySelectorAll('[data-theme]')){t.click();if(document.querySelectorAll('figure:not([hidden])').length!==1)throw Error('Gallery selection failed');checks++;}}document.querySelector('[data-page]').click();document.querySelector('[data-theme="dark"]').click();console.log('GALLERY_SELECTION_CHECK',JSON.stringify({combinations:checks,figures:document.querySelectorAll('figure').length,overflow:document.documentElement.scrollWidth>innerWidth}));</script></body></html>
